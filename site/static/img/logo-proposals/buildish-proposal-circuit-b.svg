<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Buildish logo proposal 3: Circuit B</title>
  <desc id="desc">A rounded-square emblem with a connected circuit-like B symbol beside the Buildish wordmark and headline.</desc>
  <g transform="translate(26 48)">
    <rect width="184" height="184" rx="40" fill="#111827"/>
    <rect x="16" y="16" width="152" height="152" rx="30" fill="none" opacity="0.18" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M56 42v100" fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-width="16"/>
    <path d="M68 54h52c19 0 30 10 30 26s-11 26-30 26H68" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <path d="M68 106h58c20 0 31 10 31 26s-11 26-31 26H68" fill="none" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <circle cx="151" cy="80" r="8" fill="#f8fafc"/>
    <circle cx="158" cy="132" r="8" fill="#f8fafc"/>
    <circle cx="56" cy="42" r="8" fill="#f59e0b"/>
    <circle cx="56" cy="142" r="8" fill="#f59e0b"/>
  </g>
  <text x="252" y="110" fill="#0f172a" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="56" font-weight="700">Buildish</text>
  <text x="252" y="156" fill="#475569" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22">Buildish develops build automation, CI integrations, and supporting tooling.</text>
</svg>