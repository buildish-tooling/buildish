baseURL: https://buildish.apache.org/
title: Apache Buildish (Incubating)
locale: en-us
enableRobotsTXT: true
publishDir: .public

disableKinds:
  - taxonomy
  - term
  - RSS

markup:
  highlight:
    # See https://www.docsy.dev/docs/content/lookandfeel/#code-highlighting-with-chroma
    # See https://gohugo.io/content-management/syntax-highlighting/
    #
    # "Prism" syntax highlighting looks a bit nicer, but quite some code blocks become a bit
    # too big (horizontally), so users would have to scroll horizontally to see the code.
    # 'lineNumbersInTable=true' is "required" (for UX reasons) as well.
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ''
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: false
    noClasses: true
    noHl: false
    # 'tango' == "Chroma" syntax highlighting theme
    #style: 'tango'
    tabWidth: 4
  goldmark:
    parser:
      autoHeadingID: true
      autoHeadingIDType: github
      attribute:
        # See https://gohugo.io/render-hooks/blockquotes/#alerts
        block: true
    renderer:
      unsafe: false

params:
  author:
    name: 'Apache Buildish contributors'
  offlineSearch: true

  #github_repo: https://github.com/apache/buildish
  #github_project_repo: https://github.com/apache/buildish
  #github_branch: main
  #github_subdir: site
  privacy_policy: https://privacy.apache.org/policies/privacy-policy-public.html

  ui:
    breadcrumb_disable: false
    navbar_logo: false
    sidebar_menu_foldable: true
    sidebar_menu_compact: true
    sidebar_search_disable: true
    showLightDarkModeMenu: false
  plantuml:
    # Disabled for now, loads external JS, see ASF data policy
    # https://privacy.apache.org/policies/website-policy.html
    enable: false
  markmap:
    # Disabled for now, loads external JS, see ASF data policy
    # https://privacy.apache.org/policies/website-policy.html
    enable: false

module:
  proxy: "https://proxy.golang.org,direct"
  hugoVersion:
    extended: true
    min: 0.155.3
  imports:
    - path: github.com/google/docsy
      disable: false
    - path: github.com/google/docsy/dependencies
      disable: false
  mounts:
    # These mounts assemble Hugo's virtual filesystem from two sources:
    # 1. consumer-authored site roots in this repository, and
    # 2. pipeline-generated staged roots under `.stage/`.
    #
    # `source` is the real directory on disk. `target` is the Hugo root where
    # that directory should appear (`content`, `data`, `static`, ...).
    #
    # Entries where `source == target` are intentional. Once we switch from
    # Hugo's implicit default roots to explicit mounts, every local root we still
    # want Hugo to see must be mounted again explicitly.
    # Consumer-authored content such as section roots and cascades. This must be
    # mounted alongside staged content so local docs section metadata keeps
    # applying to pipeline-generated pages under the same tree.
    - source: content
      target: content
    # Pipeline-assembled staged content is the primary content tree.
    - source: .stage/content
      target: content
    # Pipeline data files (components.json, routes.json, etc.).
    - source: .stage/data
      target: data
    # Consumer-owned data files (component_repos.json, etc.) stay visible in
    # `site.Data` alongside the pipeline data.  This explicit `data -> data`
    # mount keeps the local data root present after opting into explicit mounts.
    - source: data
      target: data
    # Pipeline-assembled static assets (component asset trees, etc.).
    - source: .stage/static
      target: static
    # Authored site-level static assets (favicons, fonts, …).
    - source: static
      target: static
    # Local layout overrides and custom partials / shortcodes.
    - source: layouts
      target: layouts
    # SCSS / JS / image assets processed by Hugo Pipes.
    - source: assets
      target: assets

privacy:
  googleAnalytics:
    disable: true
  instagram:
    simple: true
  x: # was 'twitter'
    enableDNT: true
    simple: true
  vimeo:
    enableDNT: true
    simple: true
  youtube:
    privacyEnhanced: true

