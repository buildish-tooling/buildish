[project]
name = "apache-site-pipeline"
version = "0.1.0"
description = "Reusable multi-repository site staging pipeline"
requires-python = ">=3.13"
dependencies = [
    "mistletoe>=1,<2",
    "pydantic>=2.11,<3",
    "python-frontmatter>=1,<2",
    "pyyaml>=6.0.3",
    "watchfiles>=1.1.1",
]

[project.scripts]
site-pipeline = "site_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["F", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"site_pipeline/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = ["main.py", "site_pipeline"]
explicit_package_bases = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
