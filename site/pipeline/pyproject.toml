[project]
name = "apache-buildish-site-consumer"
version = "0.1.0"
description = "Buildish consumer environment for the extracted site pipeline"
requires-python = ">=3.13"
dependencies = [
    "apache-buildish-site-pipeline",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["F", "B", "UP", "S"]

[tool.mypy]
python_version = "3.13"
files = ["refresh_latest_snapshot.py"]
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.uv.sources]
apache-buildish-site-pipeline = { path = "../../../buildish-site-pipeline/dist/snapshots/20260407-validation-fix/apache_buildish_site_pipeline-0.1.0-py3-none-any.whl" }

