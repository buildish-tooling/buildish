<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 64rem; padding: 0 1rem; line-height: 1.6; }
    header, footer { margin: 1.5rem 0; }
    nav a { margin-right: 1rem; }
    code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 0.2rem; }
    .muted { color: #555; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/projects/">Projects</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p class="muted">Rendered locally from staged content under <code>site/.stage/</code>.</p>
  </footer>
</body>
</html>
