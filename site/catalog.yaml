schemaVersion: 1
defaults:
  metadataFile: site/component.yaml
  pagesRoot: site/pages
  docsRoot: site/docs
  assetsRoot: site/assets
  publication:
    origin: docs
site:
  pagesRoot: buildish/site/content
origins:
  docs:
    baseUrl: https://buildish.org/
    canonical: true
sources:
  mammoth-cache:
    localDir: buildish-mammoth-cache
    repository: https://github.com/buildish-tooling/buildish-mammoth-cache
    defaultBranch: main
  no-gradle-wrapper-jar:
    localDir: buildish-no-gradle-wrapper-jar
    repository: https://github.com/buildish-tooling/buildish-no-gradle-wrapper-jar
    defaultBranch: main
  site-pipeline:
    localDir: buildish-site-pipeline
    repository: https://github.com/buildish-tooling/buildish-site-pipeline
    defaultBranch: main
  release-tooling:
    localDir: buildish-release-tooling
    repository: https://github.com/buildish-tooling/buildish-release-tooling
    defaultBranch: main
  site:
    localDir: buildish
    repository: https://github.com/buildish-tooling/buildish
    defaultBranch: main
    metadataFile: site/site/component.yaml
components:
  - slug: mammoth-cache
    content:
      source: mammoth-cache
    weight: 100
    publication:
      mountPath: /components/mammoth-cache/
  - slug: no-gradle-wrapper-jar
    content:
      source: no-gradle-wrapper-jar
    weight: 200
    publication:
      mountPath: /components/no-gradle-wrapper-jar/
  - slug: site-pipeline
    content:
      source: site-pipeline
    weight: 300
    publication:
      mountPath: /components/site-pipeline/
  - slug: release-tooling
    content:
      source: release-tooling
    weight: 400
    publication:
      mountPath: /components/release-tooling/
  - slug: site
    content:
      source: site
    weight: 1000
    publication:
      mountPath: /components/site/
validation:
  linkChecks:
    enabled: true
    mode: directory
    # Relative links are always checked. Root-absolute links are opt-in because
    # they may point outside the staged route inventory; Buildish treats
    # /components/ links as internal cross-component links and validates them.
    checkRootAbsolute: true
    internalPrefixes:
      - /components/
