name: Site builder image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/site-build-image.yml
      - tools/site-build-image/**
  push:
    paths:
      - .github/workflows/site-build-image.yml
      - tools/site-build-image/**

jobs:
  build-site-builder-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/buildish-site-build:latest
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Download repository source for this workflow revision
        env:
          ARCHIVE_URL: ${{ github.api_url }}/repos/${{ github.repository }}/tarball/${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${ARCHIVE_URL}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm -f repo.tar.gz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build multi-platform image without publishing
        run: tools/site-build-image/build-image.sh --engine docker --image "$IMAGE_REF" --platforms "$PLATFORMS"

      # TODO: Re-enable GHCR publishing for push/workflow_dispatch once the repository
      # is ready to publish the site builder image. Restore `packages: write` and the
      # event guards below when turning publishing back on.
      - name: Log in to GHCR
        if: ${{ false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish multi-platform image to GHCR
        if: ${{ false }}
        run: tools/site-build-image/build-image.sh --engine docker --image "$IMAGE_REF" --platforms "$PLATFORMS" --push