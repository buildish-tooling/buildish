name: IT Mammoth Cache for Gradle (Reusable)

# Real GitHub integration scenario graph for Mammoth Cache for Gradle.
#
# Scenario layout:
# - standalone_round_trip exercises a writable Linux cache round-trip by capturing the
#   action-generated cache key, saving a cache snapshot immediately, wiping Gradle user home,
#   restoring that exact key, and proving the fixture resolves offline.
# - worker_a + worker_b -> aggregator exercises distributed worker delta publication plus
#   same-run aggregator download/merge/apply using deterministic worker job names.
# - duplicate_invocation_guard proves duplicate same-job action usage is rejected.
# - pull_request_read_only checks the default PR read-only behavior under minimal permissions.
# - standalone_cross_platform is a lightweight smoke check on macOS/Windows only.
#
# Isolation/safety notes:
# - Every scenario stages a fresh fixture copy into a unique per-job build directory.
# - Every cache-key-prefix includes github.run_id/github.run_attempt, so parallel workflow runs,
#   retries, and sequential branch builds do not reuse writable cache keys accidentally.
# - Distributed artifact exchange stays within the current workflow run only; the action never uses
#   cross-run `findBy` lookups here.
# - The Windows smoke job intentionally runs under `shell: bash` and executes `./gradlew`, so the
#   fixture does not currently need a `gradlew.bat` launcher.

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: >-
          Original caller workflow event name. Reusable workflows execute as `workflow_call`, so
          the action needs the caller event to preserve event-based read-only and ref behavior.
        required: true
        type: string
      caller-resolved-ref-name:
        description: >-
          Logical ref name from the caller workflow that the action should treat as the effective
          branch for cache partitioning and summaries.
        required: true
        type: string
      caller-default-branch:
        description: >-
          Repository default branch from the caller workflow so reusable runs do not depend on the
          callee's `workflow_call` payload shape.
        required: true
        type: string
      run-pr-scenarios:
        description: >-
          Run the fork-safe pull-request scenario that verifies PR events stay read-only by
          default and can still consume the prepared wrapper/cache state.
        required: true
        type: boolean
      run-writable-scenarios:
        description: >-
          Run the trusted Linux scenarios that are allowed to publish cache/artifact outputs:
          standalone cache round-trip, distributed worker/aggregator flow, and duplicate-job guard.
        required: true
        type: boolean
      run-cross-platform:
        description: >-
          Run the lightweight standalone macOS/Windows smoke scenario that verifies wrapper setup
          and action/runtime compatibility without enabling writable cross-platform coverage.
        required: false
        default: false
        type: boolean

permissions:
  # The scenarios are designed to work with repository read-access only. Cache and current-run
  # artifact operations use the Actions runtime; this workflow does not require broader repo scopes.
  contents: read

env:
  ACTION_DIRECTORY: actions/mammoth-cache/gradle
  FIXTURE_SOURCE_DIRECTORY: actions/mammoth-cache/gradle/test/fixtures/integration/gradle-project
  BUILDISH_MAMMOTH_CACHE_GITHUB_EVENT_NAME_OVERRIDE: ${{ inputs.caller-event-name }}
  BUILDISH_MAMMOTH_CACHE_GITHUB_RESOLVED_REF_NAME_OVERRIDE: ${{ inputs.caller-resolved-ref-name }}
  BUILDISH_MAMMOTH_CACHE_GITHUB_DEFAULT_BRANCH_OVERRIDE: ${{ inputs.caller-default-branch }}

jobs:
  # Performs a deterministic same-job save -> wipe -> restore cycle using the action-generated
  # cache key, which avoids relying on post-job cache propagation timing between separate jobs.
  standalone_round_trip:
    name: Linux standalone round-trip (offline exact restore)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: standalone_round_trip
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage standalone fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/standalone-round-trip"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_standalone_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/standalone-round-trip
          cache-key-prefix: it-standalone-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit standalone prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_standalone_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_standalone_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_standalone_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_standalone_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_standalone_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_standalone_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_standalone_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_standalone_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_standalone_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_standalone_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_standalone_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_standalone_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Assert standalone prepare outputs
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_standalone_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_standalone_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_standalone_cache.outputs.job-mode }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_standalone_cache.outputs.gradle-versions }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_standalone_cache.outputs.dependent-jobs-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'standalone'
          test "$ACTION_GRADLE_VERSIONS" = '8.14.0'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '0'

      - name: Resolve standalone dependencies online
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/standalone-round-trip
        run: ./gradlew --info --no-daemon resolveStandalone

      - name: Save exact standalone cache snapshot
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.prepare_standalone_cache.outputs.cache-key }}

      - name: Wipe Gradle user home to prove restore
        run: |
          rm -rf "$HOME/.gradle"
          mkdir -p "$HOME/.gradle"

      - name: Restore exact standalone cache snapshot
        id: restore_standalone_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.prepare_standalone_cache.outputs.cache-key }}

      - name: Verify the saved cache restores offline
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/standalone-round-trip
        run: ./gradlew --info --offline --no-daemon resolveStandalone

      - name: Assert exact cache reuse
        run: |
          test "${{ steps.restore_standalone_cache.outputs.cache-hit }}" = 'true'

  # Worker A publishes one same-run delta artifact for the distributed aggregator scenario.
  worker_a:
    name: Linux distributed worker A (publish delta artifact)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: worker_a
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage worker A fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/worker-a"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_worker_a_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/worker-a
          job-mode: distributed-worker
          cache-key-prefix: it-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit worker A prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_worker_a_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_worker_a_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_worker_a_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_worker_a_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_worker_a_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_worker_a_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_worker_a_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_worker_a_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_worker_a_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_worker_a_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_worker_a_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_worker_a_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_worker_a_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_worker_a_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Produce worker A cache delta
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/worker-a
        run: ./gradlew --info --no-daemon resolveWorkerA

  # Worker B publishes an independent same-run delta artifact for the distributed aggregator.
  worker_b:
    name: Linux distributed worker B (publish delta artifact)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: worker_b
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage worker B fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/worker-b"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_worker_b_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/worker-b
          job-mode: distributed-worker
          cache-key-prefix: it-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit worker B prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_worker_b_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_worker_b_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_worker_b_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_worker_b_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_worker_b_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_worker_b_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_worker_b_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_worker_b_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_worker_b_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_worker_b_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_worker_b_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_worker_b_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_worker_b_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_worker_b_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Produce worker B cache delta
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/worker-b
        run: ./gradlew --info --no-daemon resolveWorkerB

  # Aggregator waits for both workers, downloads their current-run artifacts, applies both deltas,
  # and confirms the restored dependency jars are reused without being downloaded again before
  # post-action cleanup removes consumed worker artifacts.
  aggregator:
    name: Linux distributed aggregator (download+merge worker deltas)
    if: inputs.run-writable-scenarios
    needs: [worker_a, worker_b]
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: aggregator
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage aggregator fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/aggregator"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_aggregator_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/aggregator
          job-mode: distributed-aggregator
          dependent-jobs: worker_a,worker_b
          cache-key-prefix: it-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit aggregator prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_aggregator_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_aggregator_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_aggregator_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_aggregator_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_aggregator_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_aggregator_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_aggregator_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_aggregator_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_aggregator_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_aggregator_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_aggregator_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_aggregator_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Verify dependent worker delta jars are reused without re-download
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/aggregator
        run: |
          ./gradlew --info --no-daemon --continue resolveWorkerA resolveWorkerB 2>&1 | tee aggregator-gradle.log
          grep -F 'resolved workerA: guava-33.4.8-jre.jar' aggregator-gradle.log
          grep -F 'resolved workerB: commons-io-2.18.0.jar' aggregator-gradle.log
          if grep -Eq '(Downloading|Downloaded).*(guava-33\.4\.8-jre|commons-io-2\.18\.0)\.jar' aggregator-gradle.log; then
            echo 'Expected restored worker dependency jars to be reused, but Gradle downloaded them again.' >&2
            exit 1
          fi

      - name: Assert both worker artifacts were consumed
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_aggregator_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_aggregator_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_aggregator_cache.outputs.job-mode }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_aggregator_cache.outputs.gradle-versions }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_aggregator_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_aggregator_cache.outputs.downloaded-dependent-artifact-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'distributed-aggregator'
          test "$ACTION_GRADLE_VERSIONS" = '8.14.0'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '2'
          test "$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" = '2'

  # Proves that two action invocations in the same GitHub job cannot race or double-run post-work.
  duplicate_invocation_guard:
    name: Linux duplicate invocation guard (same-job safety)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: duplicate_invocation_guard
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage duplicate-guard fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/duplicate-guard"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: First action invocation succeeds
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/duplicate-guard
          cache-enabled: false
          read-only: true

      - name: Confirm the fixture Gradle wrapper runs
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/duplicate-guard
        run: ./gradlew --info --version

      - name: Duplicate action invocation is rejected
        id: duplicate_action
        continue-on-error: true
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/duplicate-guard
          cache-enabled: false
          read-only: true

      - name: Assert the duplicate invocation failed
        run: |
          test "${{ steps.duplicate_action.outcome }}" = 'failure'

  # Validates the PR default remains read-only under minimal permissions.
  pull_request_read_only:
    name: Pull request standalone (default read-only behavior)
    if: inputs.run-pr-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: pull_request_read_only
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage pull-request fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/pull-request"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_pull_request_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/pull-request
          cache-key-prefix: it-pr-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit pull-request prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_pull_request_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_pull_request_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_pull_request_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_pull_request_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_pull_request_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_pull_request_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_pull_request_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_pull_request_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_pull_request_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_pull_request_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_pull_request_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_pull_request_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Run a read-only PR build
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/pull-request
        run: ./gradlew --info --no-daemon resolveStandalone

      - name: Assert the PR default stayed read-only
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_pull_request_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_pull_request_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_pull_request_cache.outputs.job-mode }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_pull_request_cache.outputs.gradle-versions }}
          ACTION_READ_ONLY: ${{ steps.prepare_pull_request_cache.outputs.read-only }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_pull_request_cache.outputs.dependent-jobs-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'standalone'
          test "$ACTION_GRADLE_VERSIONS" = '8.14.0'
          test "$ACTION_READ_ONLY" = 'true'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '0'

  # Lightweight macOS/Windows smoke coverage only. This runs under bash on both platforms and uses
  # `./gradlew`, so the fixture intentionally relies on the POSIX launcher rather than `gradlew.bat`.
  standalone_cross_platform:
    name: Cross-platform standalone smoke (${{ matrix.os }})
    if: inputs.run-cross-platform
    runs-on: ${{ matrix.os }}
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: standalone_cross_platform
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Expose GnuPG on Windows PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $candidates = [System.Collections.Generic.List[string]]::new()
          $discoveredCommands = Get-Command gpg.exe -All -ErrorAction SilentlyContinue
          foreach ($discoveredCommand in $discoveredCommands) {
            if ($null -ne $discoveredCommand -and -not [string]::IsNullOrWhiteSpace($discoveredCommand.Source)) {
              $candidates.Add($discoveredCommand.Source)
            }
          }
          foreach ($candidate in @(
            'C:\Program Files\GnuPG\bin\gpg.exe',
            'C:\Program Files (x86)\GnuPG\bin\gpg.exe',
            'C:\Program Files\Git\mingw64\bin\gpg.exe',
            'C:\Program Files\Git\usr\bin\gpg.exe'
          )) {
            $candidates.Add($candidate)
          }

          $gpgPath = $candidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -Unique -First 1
          if ([string]::IsNullOrWhiteSpace($gpgPath)) {
            throw 'No gpg.exe was found on the Windows runner in the expected Git or GnuPG locations.'
          }

          Split-Path -Parent $gpgPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BUILDISH_MAMMOTH_CACHE_GRADLE_GPG_COMMAND=$gpgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gpgPath --version

      - name: Stage cross-platform fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/cross-platform-${{ matrix.os }}"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"
          chmod +x "$fixture_dir/gradlew"

      - name: Prepare Mammoth Cache for Gradle
        id: prepare_cross_platform_cache
        uses: ./actions/mammoth-cache/gradle/action-descriptors/github/very-temporary-unreleased-consumer-path
        with:
          base-directory: actions/mammoth-cache/gradle/build/integration-fixtures/cross-platform-${{ matrix.os }}
          cache-key-prefix: it-cross-platform-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-
          read-only: true

      - name: Emit cross-platform prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_cross_platform_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_cross_platform_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_cross_platform_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_cross_platform_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_cross_platform_cache.outputs.read-only }}
          ACTION_WRAPPER_COUNT: ${{ steps.prepare_cross_platform_cache.outputs.wrapper-count }}
          ACTION_GRADLE_VERSIONS: ${{ steps.prepare_cross_platform_cache.outputs.gradle-versions }}
          ACTION_WRAPPER_DOWNLOADED_COUNT: ${{ steps.prepare_cross_platform_cache.outputs.wrapper-downloaded-count }}
          ACTION_WRAPPER_REUSED_COUNT: ${{ steps.prepare_cross_platform_cache.outputs.wrapper-reused-count }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_cross_platform_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_cross_platform_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_cross_platform_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_cross_platform_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_cross_platform_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "wrapper-count=$ACTION_WRAPPER_COUNT" \
            "gradle-versions=$ACTION_GRADLE_VERSIONS" \
            "wrapper-downloaded-count=$ACTION_WRAPPER_DOWNLOADED_COUNT" \
            "wrapper-reused-count=$ACTION_WRAPPER_REUSED_COUNT" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Verify Gradle runs on this runner
        working-directory: actions/mammoth-cache/gradle/build/integration-fixtures/cross-platform-${{ matrix.os }}
        run: ./gradlew --info --version
