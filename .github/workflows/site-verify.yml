name: Site verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/site-verify.yml
      - site/**
      - tools/site-build-image/**
  push:
    paths:
      - .github/workflows/site-verify.yml
      - site/**
      - tools/site-build-image/**

jobs:
  verify-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download repository source for this workflow revision
        env:
          ARCHIVE_URL: ${{ github.api_url }}/repos/${{ github.repository }}/tarball/${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${ARCHIVE_URL}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm -f repo.tar.gz

      - name: Run site verification in the reproducible build container
        run: |
          make -C site \
            CONTAINER_ENGINE=docker \
            container-image \
            container-test \
            container-integration-test \
            container-build