name: Site publishing

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: write

concurrency:
  group: site-publishing
  cancel-in-progress: false

jobs:
  publish-site:
    runs-on: ubuntu-latest
    # Keep publishing constrained to the canonical repository and main branch.
    # This is intentionally stricter than an org-wide gate to avoid accidental
    # cross-repository or non-main publication through workflow_call.
    if: github.repository == 'apache/buildish' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Apache Site
        # TODO: Once this workflow can also check out the private component and
        # buildish-site-pipeline repositories, set
        # SITE_PIPELINE_ARGS=--missing-components fail here so production site
        # publishing fails hard on missing components.
        run: make -C site build

      - name: Copy .asf.yaml
        run: cp .asf.yaml site/.public/

      - name: Deploy Static Site to GitHub
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site/.public
