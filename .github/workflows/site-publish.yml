name: Site publishing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-publishing
  cancel-in-progress: false

jobs:
  build-site:
    name: Build aggregate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    # Push publishing reaches this reusable workflow only after the canonical CI
    # required-check job succeeds. Manual dispatch remains a main-only operator
    # override.
    if: >-
      github.repository == 'buildish-tooling/buildish' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check out aggregate repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: buildish
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build aggregate site
        uses: ./buildish/.github/actions/build-site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./buildish/site/.public

  deploy-site:
    name: Deploy aggregate site
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
