name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      site_verify: ${{ steps.filter.outputs.site_verify }}
      site_build_image: ${{ steps.filter.outputs.site_build_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes that require site jobs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/ci-detect-changes.sh

  rat:
    name: Apache RAT
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: RAT check
        run: tools/rat/rat-check.sh

  site-verify:
    name: Site verification
    needs: changes
    ## Temporarily disabled
    if: false
    #if: needs.changes.outputs.site_verify == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out buildish-site-pipeline repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/buildish-site-pipeline
          path: buildish-site-pipeline
          persist-credentials: false

      - name: Run site verification in the reproducible build container
        timeout-minutes: 6
        env:
          SITE_PIPELINE_REPO_ROOT: ${{ github.workspace }}/buildish-site-pipeline
        run: bash .github/scripts/ci-site-verify.sh

  site-build:
    name: Aggregate site build
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.site_verify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Keep the aggregate repository in the same sibling layout used by local
      # development and site publication. This bootstrap checkout is required
      # before GitHub can load the repository-local composite action.
      - name: Check out aggregate repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: buildish
          persist-credentials: false

      - name: Build aggregate site
        uses: ./buildish/.github/actions/build-site

  container-image:
    name: Site builder image
    needs: changes
    ## Temporarily disabled
    if: false
    #if: (github.event_name == 'pull_request' || github.repository_owner != 'buildish-tooling') && needs.changes.outputs.site_build_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLATFORMS: linux/amd64,linux/arm64
      LOCAL_REGISTRY_HOST: 127.0.0.1
      LOCAL_REGISTRY_PORT: '5000'
      LOCAL_REGISTRY_REPOSITORY: buildish-site-build-pr
      LOCAL_SITE_PIPELINE_REGISTRY_REPOSITORY: buildish-site-pipeline-pr
      LOCAL_REGISTRY_TAG: pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out buildish-site-pipeline repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buildish-tooling/buildish-site-pipeline
          path: buildish-site-pipeline
          persist-credentials: false

      - name: Set image references for local registry
        run: |
          echo "IMAGE_REF=${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/${LOCAL_REGISTRY_REPOSITORY}:${LOCAL_REGISTRY_TAG}" >> "$GITHUB_ENV"
          echo "SITE_PIPELINE_BASE_IMAGE=${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/${LOCAL_SITE_PIPELINE_REGISTRY_REPOSITORY}:${LOCAL_REGISTRY_TAG}" >> "$GITHUB_ENV"

      - name: Start ephemeral local registry
        run: |
          REGISTRY_IMAGE="$(awk 'toupper($1) == "FROM" { print $2; exit }' tools/site-build-image/Containerfile-local-registry)"
          docker run -d --rm \
            --name buildish-site-ci-registry \
            -p ${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}:5000 \
            "$REGISTRY_IMAGE"

      - name: Wait for local registry
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/v2/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Local registry did not become ready" >&2
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true
              insecure = true

      - name: Build site-pipeline base image into local registry
        working-directory: buildish-site-pipeline
        run: tools/site-pipeline-image/build-image.sh --engine docker --image "$SITE_PIPELINE_BASE_IMAGE" --platforms "$PLATFORMS" --push

      - name: Build site builder image into local registry
        run: tools/site-build-image/build-image.sh --engine docker --image "$IMAGE_REF" --site-pipeline-base-image "$SITE_PIPELINE_BASE_IMAGE" --platforms "$PLATFORMS" --push

      - name: Verify multi-platform image in local registry
        run: |
          MANIFEST_JSON="$(curl -fsS \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "http://${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/v2/${LOCAL_REGISTRY_REPOSITORY}/manifests/${LOCAL_REGISTRY_TAG}")"
          MANIFEST_JSON="$MANIFEST_JSON" python3 - "$PLATFORMS" <<'PY'
          import json
          import os
          import sys

          expected = set()
          for item in sys.argv[1].split(','):
              item = item.strip()
              os_name, arch = item.split('/', 1)
              expected.add((os_name, arch))

          payload = json.loads(os.environ['MANIFEST_JSON'])
          media_type = payload.get('mediaType', '')
          if media_type not in {
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
          }:
              raise SystemExit(f'Unexpected manifest media type: {media_type}')

          found = {
              (entry.get('platform', {}).get('os'), entry.get('platform', {}).get('architecture'))
              for entry in payload.get('manifests', [])
          }
          missing = expected - found
          if missing:
              raise SystemExit(f'Missing expected platforms: {sorted(missing)}; found {sorted(found)}')

          print('Verified manifest platforms:', ', '.join(f'{os_name}/{arch}' for os_name, arch in sorted(found)))
          PY

      - name: Stop ephemeral local registry
        if: ${{ always() }}
        run: docker rm -f buildish-site-ci-registry || true

  container-publish:
    name: Site builder image publish
    needs:
      - changes
      - required_checks
    if: >-
      github.repository == 'buildish-tooling/buildish' &&
      github.ref == 'refs/heads/main' &&
      needs.required_checks.result == 'success' &&
      needs.changes.outputs.site_build_image == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/buildish-site-build:latest
      SITE_PIPELINE_BASE_IMAGE: ghcr.io/buildish-tooling/buildish-site-pipeline:latest
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish multi-platform image to GHCR
        run: tools/site-build-image/build-image.sh --engine docker --image "$IMAGE_REF" --site-pipeline-base-image "$SITE_PIPELINE_BASE_IMAGE" --platforms "$PLATFORMS" --push

  codeql:
    name: CodeQL
    ## Temporarily disabled because GitHub Advanced Security is unavailable.
    if: false
    #if: github.repository_owner == 'buildish-tooling'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python,javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - changes
      - rat
      - site-verify
      - site-build
      - container-image
      - codeql
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded or were intentionally skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RAT_RESULT: ${{ needs.rat.result }}
          SITE_VERIFY_RESULT: ${{ needs.site-verify.result }}
          SITE_BUILD_RESULT: ${{ needs.site-build.result }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$RAT_RESULT" \
            "$SITE_VERIFY_RESULT" \
            "$SITE_BUILD_RESULT" \
            "$CONTAINER_IMAGE_RESULT" \
            "$CODEQL_RESULT" \
            "$ZIZMOR_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected dependency result: $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs succeeded for this event."

  site-publish:
    name: Publish aggregate site after CI
    needs: required_checks
    if: >-
      always() &&
      !cancelled() &&
      github.repository == 'buildish-tooling/buildish' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.required_checks.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site-publish.yml
