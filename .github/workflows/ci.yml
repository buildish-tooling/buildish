name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Make check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show available Make targets
        run: make help

      - name: Clean workspace outputs
        run: make clean-all

      - name: Build the project
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run lint and formatting checks
        run: make lint-check

  rat-check:
    name: Apache RAT
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Apache RAT
        run: npm run rat-check

  smoke-test:
    name: Run local action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the action bundle
        run: make build

      - name: Stage smoke fixture in build directory
        run: |
          rm -rf build/smoke-fixture
          mkdir -p build
          cp -R test/fixtures/smoke build/smoke-fixture

      - name: Run the local action
        uses: ./
        with:
          base-directory: build/smoke-fixture

  required_check:
    name: Summary
    needs: [check, rat-check, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Noop
        run: echo "Noop"
