name: CI Buildish no-gradle-wrapper-jar

on:
  push:
    paths:
      - "tools/buildish-no-gradle-wrapper-jar/**"
      - ".github/workflows/ci-buildish-no-gradle-wrapper-jar.yml"
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - "tools/buildish-no-gradle-wrapper-jar/**"
      - ".github/workflows/ci-buildish-no-gradle-wrapper-jar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-test:
    name: Helper integration test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/buildish-no-gradle-wrapper-jar
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.14.4
        env:
          GRADLE_VERSION: 8.14.4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify required toolchain
        run: |
          command -v gradle
          command -v pwsh
          command -v gpg

      - name: Run default helper integration suite
        run: make test