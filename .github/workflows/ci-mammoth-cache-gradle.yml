name: CI Mammoth Cache for Gradle

# Single entry workflow for local verification plus real GitHub integration scenarios.
#
# Event routing:
# - push / workflow_dispatch / schedule -> trusted writable integration scenario suite
# - pull_request -> fork-safe read-only integration scenario suite

on:
  push:
    paths:
      - "actions/mammoth-cache/gradle/**"
      - ".github/workflows/ci-mammoth-cache-gradle.yml"
      - ".github/workflows/it-mammoth-cache-gradle-reusable.yml"
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - "actions/mammoth-cache/gradle/**"
      - ".github/workflows/ci-mammoth-cache-gradle.yml"
      - ".github/workflows/it-mammoth-cache-gradle-reusable.yml"
  # Run once daily off-peak rather than at the top of the hour.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Make check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/mammoth-cache/gradle
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Show available Make targets
        run: make help

      - name: Clean workspace outputs
        run: make clean-all

      - name: Build the project
        run: make build

      - name: Run bundled Category X license gate
        run: make release-legal-category-x-check

      - name: Run unit tests
        run: make test

      - name: Run lint and formatting checks
        run: make lint-check

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Apache RAT
        run: npm run rat-check

  smoke-test:
    name: Run local action
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/mammoth-cache/gradle
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: actions/mammoth-cache/gradle/.nvmrc
          cache: npm
          cache-dependency-path: actions/mammoth-cache/gradle/package-lock.json

      - name: Build the action bundle
        run: make build

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage smoke fixture in build directory
        run: |
          rm -rf build/smoke-fixture
          mkdir -p build
          cp -R test/fixtures/smoke build/smoke-fixture

      - name: Run the local action
        uses: ./actions/mammoth-cache/gradle
        with:
          base-directory: actions/mammoth-cache/gradle/build/smoke-fixture

  integration-trusted:
    name: Trusted GitHub integration scenarios
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/it-mammoth-cache-gradle-reusable.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: false
      run-writable-scenarios: true
      run-cross-platform: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}

  integration-pr:
    name: Pull request GitHub integration scenarios
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/it-mammoth-cache-gradle-reusable.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.base_ref }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: true
      run-writable-scenarios: false
      run-cross-platform: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs: [check, smoke-test, integration-trusted, integration-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded or were intentionally skipped
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
          INTEGRATION_TRUSTED_RESULT: ${{ needs.integration-trusted.result }}
          INTEGRATION_PR_RESULT: ${{ needs.integration-pr.result }}
        run: |
          for result in \
            "$CHECK_RESULT" \
            "$RAT_RESULT" \
            "$SMOKE_TEST_RESULT" \
            "$INTEGRATION_TRUSTED_RESULT" \
            "$INTEGRATION_PR_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected dependency result: $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs succeeded for this event."
