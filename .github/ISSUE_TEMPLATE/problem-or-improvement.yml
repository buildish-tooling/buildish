name: Problem or improvement
description: Report a reproducible problem or propose a focused improvement.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private vulnerability details, or other
        sensitive information. Report suspected vulnerabilities through the
        private Security contact instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, missing, or harder than it should be?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: Describe the behavior or result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or proposal
      description: Provide minimal steps, an example, or a concrete proposed change.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: Include the reviewed commit, platform, runtime, and relevant tool versions.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive logs, constraints, or alternatives considered.
