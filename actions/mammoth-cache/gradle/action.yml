name: Apache Buildish Mammoth Cache Action for Gradle
description: Secure Gradle wrapper provisioning plus local and distributed cache management for Gradle builds in GitHub Actions.
author: Apache Buildish
inputs:
  config-file:
    description: >-
      Optional workspace-relative `.json`, `.yml`, or `.yaml` configuration file.
      The file must contain a top-level object whose keys use the same kebab-case
      names as this action's inputs. Direct action inputs override values loaded
      from the file. `github-token` is intentionally rejected in config files;
      pass secrets directly as action inputs or environment variables instead.
    required: false
  base-directory:
    description: >-
      Repository-relative base directory used for Gradle wrapper discovery and any
      project-relative paths. Windows-style relative paths using `\` are accepted
      and normalized internally, but drive-prefixed, rooted, and UNC paths are
      rejected. Must stay inside the workspace. Default: `.`.
    required: false
    default: .
  cache-enabled:
    description: >-
      Enables Gradle cache orchestration for this action. Accepted values: `true`
      or `false`. Default: `true`.
    required: false
    default: 'true'
  read-only:
    description: >-
      Prevents persistence of modified cache state. Accepted values: `true` or
      `false`. Defaults to `true` for pull requests and `false` for other events
      when omitted.
    required: false
  job-mode:
    description: >-
      Cache coordination mode. Supported values: `standalone`,
      `distributed-worker`, or `distributed-aggregator`. Default: `standalone`.
    required: false
    default: standalone
  dependent-jobs:
    description: >-
      Comma- or newline-separated dependent job names whose cache deltas should be
      consumed later. Only valid with distributed job modes.
    required: false
  allow-duplicate-dependent-delta-paths:
    description: >-
      Only for `distributed-aggregator` jobs. Accepted values: `true` or `false`.
      Default: `false`. When `true`, overlapping dependent-job delta paths that do
      not match exactly may be resolved by choosing the entry with the newest
      modification time instead of failing. Exact same-content/same-mode overlaps
      already merge by keeping the highest access and modification times even when
      this flag is `false`, so enable this only when duplicate-path worker output is
      expected and the relaxed conflict resolution is acceptable.
    required: false
    default: 'false'
  cache-key-prefix:
    description: >-
      Prefix used for generated cache keys. Must start with an alphanumeric
      character and then use only letters, numbers, dot, underscore, and dash.
      Default: `gradle-cache-`.
    required: false
    default: gradle-cache-
  cache-key-template:
    description: >-
      Optional restricted cache key template. Supported placeholders:
      `${cacheKeyPrefix}`, `${schemaVersion}`, `${partitionFingerprint}`,
      `${javaMajor}`, `${runnerOs}`, `${runnerArch}`, and `${refName}`.
      Custom templates must include `${partitionFingerprint}` so different cache
      partition layouts do not share the same cache key.
    required: false
  cache-partitions:
    description: >-
      Optional JSON array of cache partition overrides and custom partitions.
      Each object must contain `id`, `includes`, and optional `excludes`, all
      relative to the supported Gradle user home. Include globs must end in
      `/**`; excludes may use `*` within a segment and `**` as a whole segment.
      Overriding a built-in partition replaces its include/exclude lists. Giving a
      built-in partition an empty `includes` array disables it. Custom partitions
      must have at least one include. Hard safety excludes such as
      `**/*.lock`, `**/configuration-cache/**`, `caches/*/cc-keystore`, and
      `caches/journal-1/**` are always enforced. Active built-ins keep a
      deterministic order, custom partitions are appended after them, and if two
      partitions match the same file the manifest capture fails. The resolved
      layout feeds `${partitionFingerprint}`, so changing partition layout also
      changes the base cache key.
    required: false
  process-all-wrapper-files:
    description: >-
      Process every matching `gradle-wrapper.properties` file under the configured
      base directory. Accepted values: `true` or `false`. Cannot be combined with
      `wrapper-properties-files`. Default: `false`.
    required: false
    default: 'false'
  wrapper-properties-glob:
    description: >-
      Repository-relative glob used to discover Gradle wrapper properties beneath
      `base-directory`. Windows-style relative paths using `\` are accepted and
      normalized internally, but drive-prefixed, rooted, and UNC paths are rejected.
      Default:
      `**/gradle/wrapper/gradle-wrapper.properties`.
    required: false
    default: '**/gradle/wrapper/gradle-wrapper.properties'
  wrapper-properties-files:
    description: >-
      Comma- or newline-separated explicit `gradle-wrapper.properties` files,
      relative to `base-directory`. Windows-style relative paths using `\` are
      accepted and normalized internally, but drive-prefixed, rooted, and UNC
      paths are rejected. Entries must be explicit file paths, not glob patterns.
    required: false
  cleanup-enabled:
    description: >-
      Enables the later Gradle cache cleanup trigger flow. Accepted values:
      `true` or `false`. Default: `true`.
    required: false
    default: 'true'
  restore-cleanup-mode:
    description: >-
      Optional restore-time cleanup policy. Supported values: `none` or
      `prune-managed`. Default: `none`. `prune-managed` applies only after a
      base-cache hit: it deletes files currently matched by the active cache
      partitions, then restores the matched base cache again so the managed
      partition space reflects only restored content. It never deletes files
      outside the action-managed partition space. If the follow-up restore does
      not hit again, the action fails closed rather than continue with a partially
      pruned managed cache space.
    required: false
    default: none
  gradle-user-home:
    description: >-
      Optional Gradle user home path. In v1 only the default location is supported:
      `$GRADLE_USER_HOME` when set, otherwise `$HOME/.gradle`.
    required: false
  setup-java:
    description: >-
      Reserved compatibility flag. Setting this to `true` intentionally fails in
      v1; run `actions/setup-java` before this action instead. Default: `false`.
    required: false
    default: 'false'
  github-token:
    description: >-
      Optional GitHub token used only for authenticated wrapper JAR downloads
      against the GitHub API to reduce throttling. Defaults to the workflow
      `github.token` context when GitHub exposes it; otherwise the action falls
      back to `GITHUB_TOKEN` from the runner environment if present. Never
      written to summaries or persisted action state.
    required: false
    default: ${{ github.token }}
  internal-job-check-run-id:
    description: >-
      Internal-use workflow job identifier for direct summary/log links.
      Defaults to the current job check-run identifier when GitHub exposes it.
      End users normally should not set this manually.
    required: false
    default: ${{ job.check_run_id }}
outputs:
  cache-key:
    description: Effective base cache key resolved during the main phase, or an empty string when caching is disabled.
  base-cache-restore-status:
    description: Main-phase base cache restore classification (`feature-unavailable`, `miss`, `exact-hit`, `partial-hit`), or an empty string when caching is disabled.
  java-major:
    description: Detected Java major version used in the effective cache model, or an empty string when caching is disabled.
  job-mode:
    description: Effective normalized job mode for the current run (`standalone`, `distributed-worker`, or `distributed-aggregator`).
  read-only:
    description: Effective read-only mode after applying event-based defaults and any explicit override.
  wrapper-count:
    description: Number of Gradle wrapper properties selections successfully provisioned during the main phase.
  gradle-versions:
    description: Comma-separated sorted unique Gradle versions represented by the provisioned wrapper set for the main phase.
  wrapper-downloaded-count:
    description: Number of trusted wrapper JARs downloaded during the main phase.
  wrapper-reused-count:
    description: Number of already-correct trusted wrapper JARs reused during the main phase.
  resolved-ref-name:
    description: Effective human-readable ref name used by the action for cache partitioning and summaries.
  safe-ref-name:
    description: Cache-safe ref slug derived from the resolved ref name.
  dependent-jobs-count:
    description: Number of configured dependent jobs for distributed aggregation during the main phase.
  downloaded-dependent-artifact-count:
    description: Number of dependent distributed delta artifacts downloaded during the main phase.
  job-name:
    description: Effective CI job identity seen by the action after any supported reusable-workflow override.
runs:
  using: node24
  main: dist/github/main/index.cjs
  post: dist/github/post/index.cjs
  post-if: '!cancelled()'
