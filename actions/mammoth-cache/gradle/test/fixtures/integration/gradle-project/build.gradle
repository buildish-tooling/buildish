repositories {
  mavenCentral()
}

configurations {
  standalone
  workerA
  workerB
}

dependencies {
  standalone 'org.apache.commons:commons-lang3:3.18.0'
  workerA 'com.google.guava:guava:33.4.8-jre'
  workerB 'commons-io:commons-io:2.18.0'
}

def registerResolver = { taskName, configurationName ->
  tasks.register(taskName) {
    doLast {
      configurations.named(configurationName).get().files.each { file ->
        println("resolved ${configurationName}: ${file.name}")
      }
    }
  }
}

registerResolver('resolveStandalone', 'standalone')
registerResolver('resolveWorkerA', 'workerA')
registerResolver('resolveWorkerB', 'workerB')