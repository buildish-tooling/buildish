name: Apache Buildish Mammoth Cache Action for Gradle
description: Secure Gradle wrapper provisioning plus local and distributed cache management for Gradle builds in GitHub Actions.
author: Apache Buildish
inputs:
  config-file:
    description: >-
      Optional workspace-relative `.json`, `.yml`, or `.yaml` configuration file.
      The file must contain a top-level object whose keys use the same kebab-case
      names as this action's inputs. Direct action inputs override values loaded
      from the file. `github-token` is intentionally rejected in config files;
      pass secrets directly as action inputs or environment variables instead.
    required: false
  base-directory:
    description: >-
      Repository-relative base directory used for Gradle wrapper discovery and any
      project-relative paths. Windows-style relative paths using `\` are accepted
      and normalized internally, but drive-prefixed, rooted, and UNC paths are
      rejected. Must stay inside the workspace. Default: `.`.
    required: false
    default: .
  cache-enabled:
    description: >-
      Enables Gradle cache orchestration for this action. Accepted values: `true`
      or `false`. Default: `true`.
    required: false
    default: 'true'
  read-only:
    description: >-
      Prevents persistence of modified cache state. Accepted values: `true` or
      `false`. Defaults to `true` for pull requests and `false` for other events
      when omitted.
    required: false
  job-mode:
    description: >-
      Cache coordination mode. Supported values: `standalone`,
      `distributed-worker`, or `distributed-aggregator`. Default: `standalone`.
    required: false
    default: standalone
  dependent-jobs:
    description: >-
      Comma- or newline-separated dependent job names whose cache deltas should be
      consumed later. Only valid with distributed job modes.
    required: false
  allow-duplicate-dependent-delta-paths:
    description: >-
      Only for `distributed-aggregator` jobs. Accepted values: `true` or `false`.
      Default: `false`. When `true`, overlapping dependent-job delta paths that do
      not match exactly may be resolved by choosing the entry with the newest
      modification time instead of failing. Exact same-content/same-mode overlaps
      already merge by keeping the highest access and modification times even when
      this flag is `false`, so enable this only when duplicate-path worker output is
      expected and the relaxed conflict resolution is acceptable.
    required: false
    default: 'false'
  cache-key-prefix:
    description: >-
      Prefix used for generated cache keys. Must start with an alphanumeric
      character and then use only letters, numbers, dot, underscore, and dash.
      Default: `gradle-cache-`.
    required: false
    default: gradle-cache-
  cache-key-template:
    description: >-
      Optional restricted cache key template. Supported placeholders:
      `${cacheKeyPrefix}`, `${schemaVersion}`, `${partitionFingerprint}`,
      `${javaMajor}`, `${runnerOs}`, `${runnerArch}`, and `${refName}`.
      Custom templates must include `${partitionFingerprint}` so different cache
      partition layouts do not share the same cache key.
    required: false
  cache-partitions:
    description: >-
      Optional JSON array of cache partition overrides and custom partitions.
      Each object must contain `id`, `includes`, and optional `excludes`, all
      relative to the supported Gradle user home. Include globs must end in
      `/**`; excludes may use `*` within a segment and `**` as a whole segment.
      Overriding a built-in partition replaces its include/exclude lists. Giving a
      built-in partition an empty `includes` array disables it. Custom partitions
      must have at least one include. Hard safety excludes such as
      `**/*.lock`, `**/configuration-cache/**`, `caches/*/cc-keystore`, and
      `caches/journal-1/**` are always enforced. Active built-ins keep a
      deterministic order, custom partitions are appended after them, and if two
      partitions match the same file the manifest capture fails. The resolved
      layout feeds `${partitionFingerprint}`, so changing partition layout also
      changes the base cache key.
    required: false
  process-all-wrapper-files:
    description: >-
      Process every matching `gradle-wrapper.properties` file under the configured
      base directory. Accepted values: `true` or `false`. Cannot be combined with
      `wrapper-properties-files`. Default: `false`.
    required: false
    default: 'false'
  wrapper-properties-glob:
    description: >-
      Repository-relative glob used to discover Gradle wrapper properties beneath
      `base-directory`. Windows-style relative paths using `\` are accepted and
      normalized internally, but drive-prefixed, rooted, and UNC paths are rejected.
      Default:
      `**/gradle/wrapper/gradle-wrapper.properties`.
    required: false
    default: '**/gradle/wrapper/gradle-wrapper.properties'
  wrapper-properties-files:
    description: >-
      Comma- or newline-separated explicit `gradle-wrapper.properties` files,
      relative to `base-directory`. Windows-style relative paths using `\` are
      accepted and normalized internally, but drive-prefixed, rooted, and UNC paths
      are rejected. Cannot be combined with `process-all-wrapper-files`.
    required: false
  allowed-wrapper-checksums:
    description: >-
      Optional newline- or comma-separated list of additional trusted Gradle wrapper
      JAR SHA-256 checksums. Each value must be exactly 64 lowercase hexadecimal
      characters.
    required: false
  wrapper-validation-mode:
    description: >-
      Wrapper validation policy. Supported values: `strict`, `log-only`, and
      `disabled`. Default: `strict`.
    required: false
    default: strict
  wrapper-provenance-mode:
    description: >-
      Wrapper provenance verification policy for detached `.asc` signatures.
      Supported values: `verify`, `log-only`, and `disabled`. Default: `verify`.
    required: false
    default: verify
  gradle-user-home:
    description: >-
      Optional repository-relative override for the Gradle user home that should be
      managed by the cache model. Must stay inside the workspace when provided.
    required: false
  github-token:
    description: >-
      Optional GitHub token used for GitHub API requests when locating artifacts or
      emitting deep links. When omitted, the action falls back to the `GITHUB_TOKEN`
      environment variable if available.
    required: false
  github-job-check-run-id:
    description: >-
      Optional internal/testing override for the current GitHub job check-run ID.
      When set, job URLs point at that specific check run instead of the workflow
      run page.
    required: false
outputs:
  status:
    description: One of `hit`, `miss`, or `disabled` describing the main action outcome.
  restored-key:
    description: Restored cache key, when a base cache entry was reused.
runs:
  using: node24
  main: ../../../dist/github/main/index.cjs
  post: ../../../dist/github/post/index.cjs
